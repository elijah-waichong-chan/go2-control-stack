  postprocess: softmax
  prediction_rule: argmax
  nonzero_prediction_threshold: 0.85
  zero_index: 0
  nonzero_indices: [1, 2]
  score_smoothing:
    method: ema
    ema_alpha: 0.2
    moving_average_window: 5
