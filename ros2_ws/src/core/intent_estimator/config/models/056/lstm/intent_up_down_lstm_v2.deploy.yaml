model:
  format: onnx
  path: intent_up_down_lstm_v2.onnx
  input_name: input
  output_name: logits
  opset_version: 18
  input_layout: NCT
  dynamic_batch: true
  num_features: 12
  num_timesteps: 100
  sampling_hz: 200
  window_ms: 500
architecture:
  model_type: gru
  gru_hidden_dim: 64
  gru_num_layers: 1
  gru_bidirectional: true
  classifier_hidden_dim: 128
